<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReGroupRide · Eventos</title>
<meta name="description" content="Eventos y rutas en moto de tu comunidad en ReGroupRide.">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#5A2DB0">
<style>
@font-face{font-family:Outfit;src:url(/outfit-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Manrope;src:url(/manrope-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{--fondo:#F6F3FB;--sup:#FFFFFF;--sup2:#EFEAF8;--texto:#14101F;--texto2:#5B5470;--linea:#E2DBF0;--marca:#5A2DB0;--sobre:#fff;--suave:#EEE8FB;--accion:#D9F21C;--sobreacc:#14150F;--error:#A31919;--aviso:#8A5A00;--sombra:0 1px 2px rgba(20,16,31,.06),0 8px 28px rgba(20,16,31,.08)}
@media (prefers-color-scheme:dark){:root{--fondo:#0F0F12;--sup:#1A1A1F;--sup2:#26262C;--texto:#EEEAF6;--texto2:#A9A3B8;--linea:#34343B;--marca:#B9A2FF;--sobre:#160B33;--suave:#2A1F4A;--error:#FF7A7A;--aviso:#FFC24A;--sombra:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:500 16px/1.5 Manrope,system-ui,sans-serif;color:var(--texto);background:var(--fondo);min-height:100vh;background-image:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--marca) 18%,transparent),transparent),radial-gradient(700px 420px at -10% 10%,color-mix(in srgb,var(--accion) 12%,transparent),transparent);background-attachment:fixed}
h1,h2,h3,button,.t{font-family:Outfit,system-ui,sans-serif}
a{color:var(--marca)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;max-width:1040px;margin:0 auto;padding:18px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texto);font:700 20px/1 Outfit,sans-serif}
.logo img{width:34px;height:34px}
.logo i{font-style:normal;color:var(--marca)}
.top .sp{flex:1}
.wrap{max-width:1040px;margin:0 auto;padding:8px 20px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--sup2);color:var(--texto);font:600 16px/1 Outfit,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accion);color:var(--sobreacc);box-shadow:inset 0 0 0 1.5px rgba(20,21,15,.16)}
.btn.mar{background:var(--marca);color:var(--sobre)}
.btn.big{min-height:56px;width:100%;font-size:18px;border-radius:16px}
.btn.txt{background:none;color:var(--marca);padding:0 8px}
.btn.del{background:none;color:var(--error)}
.btn[disabled]{opacity:.55;cursor:default}
.card{background:var(--sup);border-radius:22px;box-shadow:var(--sombra);padding:22px}
label{display:grid;gap:6px;font:600 14px/1.3 Manrope,sans-serif;color:var(--texto2)}
input,textarea,select{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--linea);border-radius:14px;background:var(--sup);color:var(--texto);font:500 16px/1.4 Manrope,sans-serif}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid color-mix(in srgb,var(--marca) 35%,transparent);border-color:var(--marca)}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.msg{padding:12px 14px;border-radius:14px;background:var(--suave);font-weight:600}
.msg.bad{background:color-mix(in srgb,var(--error) 14%,var(--sup));color:var(--error)}
.muted{color:var(--texto2)}
.small{font-size:14px}
/* evento (página pública, como Luma) */
.ev{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:36px;align-items:start}
.cover{aspect-ratio:1/1;border-radius:22px;background:var(--sup2) center/cover no-repeat;box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover.wide{aspect-ratio:16/9}
.cover img.sym{width:38%;opacity:.5}
.host{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}
.host .av{width:40px;height:40px;border-radius:50%;background:var(--marca);color:var(--sobre);display:flex;align-items:center;justify-content:center;font:700 18px Outfit}
.ev h1{font:700 clamp(32px,5vw,48px)/1.08 Outfit,sans-serif;margin:0 0 22px;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.tile{flex:none;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--linea);background:var(--sup);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font:700 18px/1 Outfit}
.tile small{display:block;width:100%;text-align:center;background:var(--sup2);font:700 10px/16px Manrope;text-transform:uppercase;color:var(--texto2)}
.tile svg{width:22px;height:22px;stroke:var(--texto2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block;font:600 17px/1.3 Outfit}
.row span{color:var(--texto2);font-size:14px}
.reg{margin:22px 0;padding:0;overflow:hidden}
.reg .hd{padding:10px 18px;background:var(--sup2);font:600 14px Manrope;color:var(--texto2)}
.reg .bd{padding:18px;display:grid;gap:12px}
.state{display:flex;align-items:center;gap:10px;font:600 17px Outfit}
.dot{width:12px;height:12px;border-radius:50%;background:var(--marca)}
.dot.w{background:var(--aviso)}
h2{font:600 15px Manrope;color:var(--texto2);margin:26px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--linea)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
/* panel */
.hd1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.hd1 h1{font:700 32px/1.1 Outfit;margin:0;flex:1}
.coms{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.coms button{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--linea);background:var(--sup);color:var(--texto);font:600 15px Outfit;cursor:pointer}
.coms button[aria-pressed=true]{background:var(--marca);border-color:var(--marca);color:var(--sobre)}
.list{display:grid;gap:14px}
.item{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;padding:14px}
.item .cover{border-radius:14px;box-shadow:none}
.item h3{font:600 20px/1.2 Outfit;margin:2px 0 4px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.item .acts .btn{min-height:40px;padding:0 14px;font-size:14px}
.edit{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:30px;align-items:start}
.pick{position:relative;cursor:pointer}
.pick span{position:absolute;right:12px;bottom:12px;padding:8px 14px;border-radius:999px;background:rgba(15,15,18,.78);color:#fff;font:600 13px Outfit}
.title-in{border:0;background:none;padding:0;font:700 clamp(28px,4.5vw,40px)/1.1 Outfit,sans-serif;min-height:0;border-radius:0}
.title-in:focus{outline:0}
.auth{max-width:420px;margin:6vh auto 0}
.auth h1{font:700 30px/1.15 Outfit;margin:0 0 6px}
.md p{margin:0 0 12px}.md ul,.md ol{margin:0 0 12px;padding-left:22px}.md li{margin:2px 0}.md h3,.md h4{font:700 19px/1.25 Outfit;margin:18px 0 8px}.md h4{font-size:17px}.md{overflow-wrap:anywhere}
.map{width:100%;height:190px;border:0;border-radius:16px;margin:4px 0 14px;display:block;background:var(--sup2)}
.chk{display:flex;align-items:flex-start;gap:10px;font:500 15px/1.35 Manrope;color:var(--texto)}.chk input{width:22px;height:22px;min-height:0;flex:none;margin:0;accent-color:var(--marca)}
.faces{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.faces i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--suave);color:var(--marca);display:inline-flex;align-items:center;justify-content:center;font:700 14px Outfit;margin-right:-12px;border:2px solid var(--fondo)}.faces span{margin-left:10px}
.tk{display:grid;gap:10px;justify-items:center;text-align:center;padding:16px;border:1.5px dashed var(--linea);border-radius:18px}.tk .qr{width:200px;height:200px;background:#fff;border-radius:12px;padding:8px}.tk .qr svg{width:100%;height:100%;display:block}
.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2 .btn{min-height:42px;padding:0 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 16px}.stats div{background:var(--sup);border-radius:16px;padding:12px 14px;box-shadow:var(--sombra)}.stats b{display:block;font:700 26px/1.1 Outfit}.stats span{font-size:13px;color:var(--texto2)}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linea)}.g:last-child{border-bottom:0}.g b{font:600 16px Outfit}.g .acts2 .btn{min-height:38px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--sup2);font:700 11px/16px Manrope;color:var(--texto2);margin-left:6px;vertical-align:2px}.tag.ok{background:color-mix(in srgb,var(--accion) 55%,var(--sup));color:var(--sobreacc)}.tag.w{background:color-mix(in srgb,var(--aviso) 22%,var(--sup));color:var(--aviso)}
.scan{position:fixed;inset:0;z-index:20;background:#0b0b0e;color:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;overflow:auto}.scan video{width:min(100%,460px);aspect-ratio:1/1;object-fit:cover;border-radius:20px;background:#000}.scan .r{width:min(100%,460px);padding:14px 16px;border-radius:16px;background:#1d1d22;font:600 18px Outfit;min-height:56px}.scan .r.ok{background:#D9F21C;color:#14150F}.scan .r.bad{background:#7a1616}.scan input{max-width:460px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 130px auto;gap:8px;align-items:center}.qrow input,.qrow select{min-height:44px}.sec{font:700 18px Outfit;margin:10px 0 0}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.g{grid-template-columns:1fr}.qrow{grid-template-columns:1fr 1fr}}
@media (max-width:760px){#who{display:none}.ev,.edit{grid-template-columns:1fr;gap:22px}.cover{aspect-ratio:16/9}.item{grid-template-columns:104px minmax(0,1fr);gap:12px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>

  /* ---------- sesión ---------- */

    $('#sf', el).onsubmit = function (ev) { ev.preventDefault(); check($('#sc', el).value); $('#sc', el).value = ''; };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('Este navegador no deja usar la cámara. Escribe el código o marca la llegada en la lista.', 'bad'); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
      stream = s; v.srcObject = s; v.play();
      var det = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null, ready = det ? Promise.resolve() : lib('scan');
      ready.then(function () {
        timer = setInterval(function () {
          if (v.readyState < 2) return;
          if (det) det.detect(v).then(function (c) { if (c[0]) check(c[0].rawValue); }, function () {});
          else { var w = cv.width = 480, h = cv.height = Math.round(480 * v.videoHeight / v.videoWidth) || 480, x = cv.getContext('2d', { willReadFrequently: true }); x.drawImage(v, 0, 0, w, h); var q = jsQR(x.getImageData(0, 0, w, h).data, w, h); if (q) check(q.data); }
        }, 300);
      }, function (x) { say(err(x), 'bad'); });
    }, function () { say('No hay permiso para usar la cámara. Escribe el código o marca la llegada en la lista.', 'bad'); });
  }

  /* ---------- panel: mis comunidades y sus eventos ---------- */
  function loadComs() {
    return sb.from('community_members').select('role,communities(id,name)').eq('user_id', user.id).then(function (r) {
      if (r.error) throw r.error;
      S.coms = (r.data || []).filter(function (x) { return x.communities; }).map(function (x) { return { id: x.communities.id, name: x.communities.name, admin: x.role === 'admin' }; });
      var want = param('c');
      if (want && S.coms.some(function (c) { return c.id === want; })) S.cid = want;
      if (!S.cid || !S.coms.some(function (c) { return c.id === S.cid; })) S.cid = (S.coms.filter(function (c) { return c.admin; })[0] || S.coms[0] || {}).id || null;
    });
  }
  function com() { return S.coms.filter(function (c) { return c.id === S.cid; })[0]; }
  function panel() {
    var c = com();
    if (!c) { app.innerHTML = '<div class="auth card"><h1>Aún no estás en ninguna comunidad</h1><p class="muted">Crea tu comunidad o únete a una desde la app de ReGroupRide (pestaña Comunidad). Después podrás crear sus eventos aquí.</p></div>'; return; }
    app.innerHTML = '<div class="hd1"><h1>Eventos</h1><a class="btn" href="/?com=' + c.id + '">Página pública</a>' + (c.admin ? '<button class="btn pri" id="new" type="button">+ Crear evento</button>' : '') + '</div>' +
      (S.coms.length > 1 ? '<div class="coms">' + S.coms.map(function (x) { return '<button type="button" data-c="' + x.id + '" aria-pressed="' + (x.id === c.id) + '">' + esc(x.name) + '</button>'; }).join('') + '</div>' : '<p class="muted" style="margin-top:-8px">' + esc(c.name) + '</p>') +
      (c.admin ? '' : '<p class="msg">En esta comunidad no eres administrador: puedes ver los eventos y apuntarte, pero no crearlos.</p>') +
      '<div id="msg" class="msg" hidden></div><div class="list" id="list"><p class="muted">Cargando…</p></div>';
    $$('.coms button').forEach(function (b) { b.onclick = function () { S.cid = b.dataset.c; panel(); }; });
    if ($('#new')) $('#new').onclick = function () { editor(null); };
    sb.from('events').select('id,title,starts_at,meet_name,cover_url,capacity,listed,open_reg').eq('community_id', c.id).order('starts_at', { ascending: false }).limit(60).then(function (r) {
      if (r.error) { $('#list').innerHTML = '<p class="msg bad">' + esc(err(r.error)) + '</p>'; return; }
      var evs = r.data || [], now = Date.now();
      evs.sort(function (a, b) { var A = new Date(a.starts_at).getTime(), B = new Date(b.starts_at).getTime(), fa = A >= now, fb = B >= now; return fa !== fb ? (fa ? -1 : 1) : (fa ? A - B : B - A); });
      $('#list').innerHTML = evs.length ? evs.map(function (e) {
        var d = new Date(e.starts_at);
        return '<div class="card item" data-id="' + e.id + '">' + coverHtml(e.cover_url, ' wide') + '<div>' +
          '<span class="muted small">' + D[d.getDay()] + ' ' + d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear() + ' · ' + hhmm(d) + (d.getTime() < now ? ' · pasado' : '') + '</span><h3>' + esc(e.title) + '</h3>' +
          '<span class="muted small">' + [e.capacity ? e.capacity + ' plazas' : 'Sin límite de plazas', e.meet_name ? esc(e.meet_name) : '', e.listed === false ? 'oculto en la página pública' : '', e.open_reg === false ? 'inscripciones cerradas' : ''].filter(Boolean).join(' · ') + '</span>' +
          '<div class="acts"><a class="btn" href="/?e=' + e.id + '">Ver página</a><button class="btn" data-a="copy" type="button">Copiar enlace</button>' + (c.admin ? '<a class="btn" href="/?m=' + e.id + '">Inscritos</a><button class="btn" data-a="edit" type="button">Editar</button>' : '') + '</div></div></div>';
      }).join('') : '<div class="card"><b class="t">Todavía no hay eventos</b><p class="muted" style="margin:6px 0 0">' + (c.admin ? 'Crea el primero con «Crear evento». Aparecerá también en la app, y a los miembros les llegará el aviso.' : 'Cuando un administrador cree uno, aparecerá aquí y en la app.') + '</p></div>';
      $$('.item').forEach(function (it) {
        var id = it.dataset.id, cp = $('[data-a=copy]', it), ed = $('[data-a=edit]', it);
        cp.onclick = function () { copy(cp, location.origin + '/?e=' + id, 'Enlace del evento'); };
        if (ed) ed.onclick = function () { editor(id); };
      });
      var we = param('edit');
      if (we && c.admin) { history.replaceState(null, '', '/'); editor(we); }
    });
  }

  /* ---------- crear o editar un evento ---------- */
  function coverBlob(file) {
    return new Promise(function (ok, no) {
      var im = new Image(), u = URL.createObjectURL(file);
      im.onerror = function () { no(new Error('No se puede leer esa imagen.')); };
      im.onload = function () {
        var W = 1280, H = 720, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        var k = Math.max(W / im.width, H / im.height), w = im.width * k, h = im.height * k;
        cv.getContext('2d').drawImage(im, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(u);
        cv.toBlob(function (b) { b ? ok(b) : no(new Error('No se puede preparar la imagen.')); }, 'image/jpeg', 0.84);
      };
      im.src = u;
    });
  }
  function coords(url) { var m = /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(url) || /[?&](?:q|query|destination|ll)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i.exec(url) || /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/.exec(url); return m ? [+m[1], +m[2]] : null; }
  function editor(id) {
    var c = com();
    var draw = function (e) {
      var d = e ? new Date(e.starts_at) : (function () { var x = new Date(Date.now() + 7 * 864e5); x.setHours(10, 0, 0, 0); return x; })(), cv = e && safeUrl(e.cover_url), blob = null, ll = null, N = !e;
      var on = function (k, def) { return (e ? e[k] !== false && (e[k] || def) : def) ? ' checked' : ''; }, qs = (e && e.questions || []).map(function (q) { return { id: q.id, label: q.label, type: q.type || 'text', options: q.options || [], required: !!q.required }; });
      app.innerHTML = '<p><button class="btn txt" id="back" type="button">← Eventos de ' + esc(c.name) + '</button></p><form class="edit" id="ef">' +
        '<div><label class="pick"><div class="cover wide" id="cv"' + (cv ? ' style="background-image:url(&quot;' + esc(cv) + '&quot;)"' : '') + '>' + (cv ? '' : '<img class="sym" src="' + SYM + '" alt="">') + '</div><span>' + (cv ? 'Cambiar portada' : 'Subir portada') + '</span><input id="file" type="file" accept="image/*" hidden></label><p class="muted small">Foto apaisada (16:9). Si no pones ninguna, en la app se ve el mapa del punto de salida.</p></div>' +
        '<div class="form"><input class="title-in" id="title" required maxlength="120" placeholder="Nombre del evento" value="' + esc(e ? e.title : '') + '">' +
        '<div class="two"><label>Empieza<input id="when" type="datetime-local" required value="' + localInput(d) + '"></label><label>Termina (opcional)<input id="end" type="datetime-local" value="' + (e && e.ends_at ? localInput(new Date(e.ends_at)) : '') + '"></label></div>' +
        '<label>Punto de salida<input id="meet" maxlength="120" placeholder="Gasolinera Repsol de Teulada" value="' + esc(e ? e.meet_name : '') + '"></label>' +
        '<label>Indicaciones para encontrarse (opcional)<input id="note" maxlength="300" placeholder="Entrando por la entrada principal, a mano izquierda" value="' + esc(e && e.meet_note || '') + '"></label>' +
        '<label>Enlace de Google Maps del punto de salida (opcional)<input id="murl" inputmode="url" maxlength="600" placeholder="https://maps.app.goo.gl/…" value="' + esc(e && e.meet_url ? e.meet_url : '') + '"></label>' +
        '<div class="acts2"><button class="btn" id="geo" type="button">Buscar el punto de salida en el mapa</button><span class="muted small" id="geot" style="align-self:center">' + (e && e.meet_lat != null ? 'Mapa: punto guardado' : 'Sirve para enseñar el mapa en la página') + '</span></div>' +
        '<label>Descripción<textarea id="desc" maxlength="4000" placeholder="Recorrido, paradas, ritmo, qué hay que llevar…">' + esc(e ? e.description : '') + '</textarea><span class="small">Formato: **negrita**, *cursiva*, listas con «- » o «1. », títulos con «# » y enlaces pegados tal cual.</span></label>' +
        '<p class="sec">Inscripción</p>' +
        '<label>Plazas, en motos (vacío = sin límite)<input id="cap" type="number" min="1" max="1000" inputmode="numeric" value="' + (e && e.capacity ? e.capacity : '') + '"></label>' +
        '<label class="chk"><input type="checkbox" id="o_open"' + on('open_reg', true) + '><span>Inscripciones abiertas</span></label>' +
        '<label class="chk"><input type="checkbox" id="o_guests"' + on('allow_guests', true) + '><span>Cualquiera con el enlace puede apuntarse desde la web, sin cuenta ni app (nombre, correo y teléfono)</span></label>' +
        '<label class="chk"><input type="checkbox" id="o_appr"' + on('require_approval', false) + '><span>Aprobar a mano cada inscripción hecha desde la web</span></label>' +
        '<label class="chk"><input type="checkbox" id="o_show"' + on('show_guests', true) + '><span>Enseñar cuántos van y sus nombres a los demás asistentes</span></label>' +
        '<label class="chk"><input type="checkbox" id="o_list"' + on('listed', true) + '><span>Aparece en la página pública de la comunidad</span></label>' +
        '<p class="sec">Preguntas al apuntarse desde la web</p><div class="form" id="qs"></div><div><button class="btn" id="qadd" type="button">+ Añadir pregunta</button></div>' +
        '<p class="muted small" style="margin:0">La ruta para seguir en el mapa se añade desde la app (editar el evento → «Ruta»).</p>' +
        '<div id="msg" class="msg" hidden></div><button class="btn pri big" type="submit">' + (e ? 'Guardar cambios' : 'Crear evento') + '</button>' +
        (e ? '<button class="btn del" id="del" type="button">Borrar el evento</button>' : '') + '</div></form>';
      var drawQs = function () {
        $('#qs').innerHTML = qs.map(function (q, i) {
          return '<div data-i="' + i + '"><div class="qrow"><input data-k="label" maxlength="120" placeholder="Pregunta (p. ej. ¿Qué bocadillo quieres?)" value="' + esc(q.label) + '"><select data-k="type"><option value="text"' + (q.type === 'text' ? ' selected' : '') + '>Texto</option><option value="select"' + (q.type === 'select' ? ' selected' : '') + '>Opciones</option><option value="check"' + (q.type === 'check' ? ' selected' : '') + '>Casilla</option></select><button class="btn del" data-k="del" type="button">Quitar</button></div>' +
            (q.type === 'select' ? '<input data-k="options" style="margin-top:8px" placeholder="Opciones separadas por comas" value="' + esc(q.options.join(', ')) + '">' : '') +
            '<label class="chk" style="margin-top:8px"><input type="checkbox" data-k="required"' + (q.required ? ' checked' : '') + '><span>Obligatoria</span></label></div>';
        }).join('');
        $$('#qs [data-k]').forEach(function (el) {
          var q = qs[+el.closest('[data-i]').dataset.i], k = el.dataset.k;
          if (k === 'del') el.onclick = function () { qs.splice(qs.indexOf(q), 1); drawQs(); };
          else if (k === 'type') el.onchange = function () { q.type = el.value; drawQs(); };
          else if (k === 'required') el.onchange = function () { q.required = el.checked; };
          else if (k === 'options') el.oninput = function () { q.options = el.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); };
          else el.oninput = function () { q.label = el.value; };
        });
      };
      drawQs();
      $('#qadd').onclick = function () { if (qs.length >= 12) return; qs.push({ id: 'q' + Date.now().toString(36) + qs.length, label: '', type: 'text', options: [], required: false }); drawQs(); };
      $('#back').onclick = panel;
      $('#geo').onclick = function () {
        var q = $('#meet').value.trim(); if (!q) { msg('Escribe primero el punto de salida.', true); return; }
        busy(this, function () { return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&q=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (a) { if (!a.length) throw new Error('No se ha encontrado ese sitio. Prueba con la dirección o pega el enlace de Google Maps.'); ll = [+a[0].lat, +a[0].lon]; msg(''); $('#geot').textContent = 'Encontrado: ' + a[0].display_name.slice(0, 90); }); });
      };
      $('#file').onchange = function () { var f = this.files[0]; if (!f) return; coverBlob(f).then(function (b) { blob = b; var el = $('#cv'); el.style.backgroundImage = 'url("' + URL.createObjectURL(b) + '")'; el.innerHTML = ''; }, function (x) { msg(err(x), true); }); };
      $('#ef').onsubmit = function (ev) {
        ev.preventDefault();
        busy($('#ef button[type=submit]'), function () {
          var t = new Date($('#when').value); if (isNaN(t)) throw new Error('Pon la fecha y la hora.');
          var f = $('#end').value ? new Date($('#end').value) : null; if (f && !(f > t)) throw new Error('La hora de fin tiene que ser posterior a la de inicio.');
          var murl = $('#murl').value.trim(); if (murl && !/^https?:\/\//i.test(murl)) throw new Error('El enlace del punto de salida tiene que empezar por https://');
          var good = qs.filter(function (q) { return q.label.trim(); }); if (good.some(function (q) { return q.type === 'select' && q.options.length < 2; })) throw new Error('Las preguntas de opciones necesitan al menos dos opciones.');
          var cap = parseInt($('#cap').value, 10), pin = ll || (murl ? coords(murl) : null);
          var row = { community_id: c.id, title: $('#title').value.trim(), starts_at: t.toISOString(), ends_at: f ? f.toISOString() : null, meet_name: $('#meet').value.trim(), meet_note: $('#note').value.trim(), meet_url: murl || null, description: $('#desc').value.trim(), capacity: cap > 0 ? cap : null,
            open_reg: $('#o_open').checked, allow_guests: $('#o_guests').checked, require_approval: $('#o_appr').checked, show_guests: $('#o_show').checked, listed: $('#o_list').checked,
            questions: good.map(function (q) { return { id: q.id, label: q.label.trim(), type: q.type, options: q.type === 'select' ? q.options : [], required: q.required }; }) };
          if (pin) { row.meet_lat = pin[0]; row.meet_lon = pin[1]; } else if (N || murl !== (e.meet_url || '')) { row.meet_lat = null; row.meet_lon = null; }
          var up = blob ? (function () { var path = user.id + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.jpg'; return sb.storage.from('covers').upload(path, blob, { contentType: 'image/jpeg' }).then(function (r) { if (r.error) throw new Error('No se ha podido subir la portada: ' + err(r.error)); row.cover_url = sb.storage.from('covers').getPublicUrl(path).data.publicUrl; }); })() : Promise.resolve();
          return up.then(function () { return e ? sb.from('events').update(row).eq('id', e.id).select('id') : sb.from('events').insert(row).select('id'); }).then(function (r) {
            if (r.error) throw r.error; if (!r.data || !r.data.length) throw new Error('No se ha guardado: no tienes permiso para editar este evento.');
            ring(c.id, { kind: e ? 'edit' : 'event' }); location.href = '/?e=' + r.data[0].id;
          });
        });
      };
      if ($('#del')) $('#del').onclick = function () { var b = this; if (b.dataset.sure) busy(b, function () { return sb.from('events').delete().eq('id', e.id).then(function (r) { if (r.error) throw r.error; ring(c.id, { kind: 'edit' }); panel(); }); }); else { b.dataset.sure = 1; b.textContent = 'Pulsa otra vez para borrarlo (no se puede deshacer)'; } };
    };
    if (!id) { draw(null); return; }
    sb.from('events').select('id,title,description,starts_at,ends_at,meet_name,meet_note,meet_url,meet_lat,capacity,cover_url,open_reg,allow_guests,require_approval,show_guests,listed,questions').eq('id', id).maybeSingle().then(function (r) { if (r.error || !r.data) { panel(); return; } draw(r.data); });
  }

  /* ---------- arranque ---------- */
  function start() {
    var id = eventId(), cm = comId(), mg = param('m');
    if (id) { eventView(id); return; }
    if (cm) { communityView(cm); return; }
    if (!user) { authView(start, mg ? 'Entra con tu cuenta de administrador para ver los inscritos.' : 'Entra para crear y gestionar los eventos de tu comunidad. Es la misma cuenta de la app.'); return; }
    if (mg) { manageView(mg); return; }
    loadComs().then(panel, function (e) { app.innerHTML = '<p class="msg bad">' + esc(err(e)) + '</p>'; });
  }
  sb.auth.getSession().then(function (r) { user = r.data && r.data.session ? r.data.session.user : null; head(); start(); }, function () { start(); });
})();
</script>
