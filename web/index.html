<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReGroupRide · Eventos</title>
<meta name="description" content="Eventos y rutas en moto de tu comunidad en ReGroupRide.">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#5A2DB0">
<style>
@font-face{font-family:Outfit;src:url(/outfit-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:Manrope;src:url(/manrope-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{--fondo:#F6F3FB;--sup:#FFFFFF;--sup2:#EFEAF8;--texto:#14101F;--texto2:#5B5470;--linea:#E2DBF0;--marca:#5A2DB0;--sobre:#fff;--suave:#EEE8FB;--accion:#D9F21C;--sobreacc:#14150F;--error:#A31919;--aviso:#8A5A00;--sombra:0 1px 2px rgba(20,16,31,.06),0 8px 28px rgba(20,16,31,.08)}
@media (prefers-color-scheme:dark){:root{--fondo:#0F0F12;--sup:#1A1A1F;--sup2:#26262C;--texto:#EEEAF6;--texto2:#A9A3B8;--linea:#34343B;--marca:#B9A2FF;--sobre:#160B33;--suave:#2A1F4A;--error:#FF7A7A;--aviso:#FFC24A;--sombra:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:500 16px/1.5 Manrope,system-ui,sans-serif;color:var(--texto);background:var(--fondo);min-height:100vh;background-image:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--marca) 18%,transparent),transparent),radial-gradient(700px 420px at -10% 10%,color-mix(in srgb,var(--accion) 12%,transparent),transparent);background-attachment:fixed}
h1,h2,h3,button,.t{font-family:Outfit,system-ui,sans-serif}
a{color:var(--marca)}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:12px;max-width:1040px;margin:0 auto;padding:18px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texto);font:700 20px/1 Outfit,sans-serif}
.logo img{width:34px;height:34px}
.logo i{font-style:normal;color:var(--marca)}
.top .sp{flex:1}
.wrap{max-width:1040px;margin:0 auto;padding:8px 20px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border:0;border-radius:14px;background:var(--sup2);color:var(--texto);font:600 16px/1 Outfit,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accion);color:var(--sobreacc);box-shadow:inset 0 0 0 1.5px rgba(20,21,15,.16)}
.btn.mar{background:var(--marca);color:var(--sobre)}
.btn.big{min-height:56px;width:100%;font-size:18px;border-radius:16px}
.btn.txt{background:none;color:var(--marca);padding:0 8px}
.btn.del{background:none;color:var(--error)}
.btn[disabled]{opacity:.55;cursor:default}
.card{background:var(--sup);border-radius:22px;box-shadow:var(--sombra);padding:22px}
label{display:grid;gap:6px;font:600 14px/1.3 Manrope,sans-serif;color:var(--texto2)}
input,textarea,select{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--linea);border-radius:14px;background:var(--sup);color:var(--texto);font:500 16px/1.4 Manrope,sans-serif}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:3px solid color-mix(in srgb,var(--marca) 35%,transparent);border-color:var(--marca)}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.msg{padding:12px 14px;border-radius:14px;background:var(--suave);font-weight:600}
.msg.bad{background:color-mix(in srgb,var(--error) 14%,var(--sup));color:var(--error)}
.muted{color:var(--texto2)}
.small{font-size:14px}
/* evento (página pública, como Luma) */
.ev{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:36px;align-items:start}
.cover{aspect-ratio:1/1;border-radius:22px;background:var(--sup2) center/cover no-repeat;box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover.wide{aspect-ratio:16/9}
.cover img.sym{width:38%;opacity:.5}
.host{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}
.host .av{width:40px;height:40px;border-radius:50%;background:var(--marca);color:var(--sobre);display:flex;align-items:center;justify-content:center;font:700 18px Outfit}
.ev h1{font:700 clamp(32px,5vw,48px)/1.08 Outfit,sans-serif;margin:0 0 22px;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:14px;margin:0 0 14px}
.tile{flex:none;width:48px;height:48px;border-radius:12px;border:1.5px solid var(--linea);background:var(--sup);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font:700 18px/1 Outfit}
.tile small{display:block;width:100%;text-align:center;background:var(--sup2);font:700 10px/16px Manrope;text-transform:uppercase;color:var(--texto2)}
.tile svg{width:22px;height:22px;stroke:var(--texto2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block;font:600 17px/1.3 Outfit}
.row span{color:var(--texto2);font-size:14px}
.reg{margin:22px 0;padding:0;overflow:hidden}
.reg .hd{padding:10px 18px;background:var(--sup2);font:600 14px Manrope;color:var(--texto2)}
.reg .bd{padding:18px;display:grid;gap:12px}
.state{display:flex;align-items:center;gap:10px;font:600 17px Outfit}
.dot{width:12px;height:12px;border-radius:50%;background:var(--marca)}
.dot.w{background:var(--aviso)}
h2{font:600 15px Manrope;color:var(--texto2);margin:26px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--linea)}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}
/* panel */
.hd1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.hd1 h1{font:700 32px/1.1 Outfit;margin:0;flex:1}
.coms{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.coms button{min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--linea);background:var(--sup);color:var(--texto);font:600 15px Outfit;cursor:pointer}
.coms button[aria-pressed=true]{background:var(--marca);border-color:var(--marca);color:var(--sobre)}
.list{display:grid;gap:14px}
.item{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;padding:14px}
.item .cover{border-radius:14px;box-shadow:none}
.item h3{font:600 20px/1.2 Outfit;margin:2px 0 4px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.item .acts .btn{min-height:40px;padding:0 14px;font-size:14px}
.edit{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:30px;align-items:start}
.pick{position:relative;cursor:pointer}
.pick span{position:absolute;right:12px;bottom:12px;padding:8px 14px;border-radius:999px;background:rgba(15,15,18,.78);color:#fff;font:600 13px Outfit}
.title-in{border:0;background:none;padding:0;font:700 clamp(28px,4.5vw,40px)/1.1 Outfit,sans-serif;min-height:0;border-radius:0}
.title-in:focus{outline:0}
.auth{max-width:420px;margin:6vh auto 0}
.auth h1{font:700 30px/1.15 Outfit;margin:0 0 6px}
@media (max-width:760px){#who{display:none}.ev,.edit{grid-template-columns:1fr;gap:22px}.cover{aspect-ratio:16/9}.item{grid-template-columns:104px minmax(0,1fr);gap:12px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><a class="logo" href="/"><img src="/simbolo.svg" alt=""><span>ReGroup<i>Ride</i></span></a><span class="sp"></span><span id="who" class="muted small"></span><button class="btn txt" id="out" hidden>Salir</button></header>
<main class="wrap" id="app"><p class="muted">Cargando…</p></main>
<script src="/supabase.js"></script>
<script>
(function () {
  'use strict';
  // Claves públicas del proyecto (las mismas que lleva la app; lo que cada uno puede ver lo decide el servidor).
  var SB_URL = 'https://lpkeaxtzfbuqjkkusjit.supabase.co', SB_KEY = 'sb_publishable_lUo3IlFV8X0pVL5HUfbgNA_VLeizTOw';
  var sb = supabase.createClient(SB_URL, SB_KEY), app = document.getElementById('app'), user = null, S = { coms: [], cid: null };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function safeUrl(u) { return /^https:\/\//i.test(u || '') ? u : ''; }
  var D = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], DL = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'], M = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'], ML = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function hhmm(d) { return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  function localInput(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + hhmm(d); }
  function err(e) { var m = (e && e.message) || String(e); if (/row-level security|permission denied/i.test(m)) m = 'No tienes permiso para hacer eso.'; if (/Invalid login/i.test(m)) m = 'Correo o contraseña incorrectos.'; return m; }
  function eventId() { var m = /^\/e\/([0-9a-f-]{36})/i.exec(location.pathname) || /[?&]e=([0-9a-f-]{36})/i.exec(location.search); return m ? m[1] : null; }
  function ring(cid, p) { try { var ch = sb.channel('rg-c-' + cid); ch.send({ type: 'broadcast', event: 'ping', payload: p }).then(function () { sb.removeChannel(ch); }, function () {}); } catch (e) {} }
  function busy(b, fn) { b.disabled = true; var t = b.innerHTML; return Promise.resolve().then(fn).catch(function (e) { msg(err(e), true); }).then(function () { b.disabled = false; b.innerHTML = t; }); }
  function msg(t, bad) { var m = $('#msg'); if (m) { m.textContent = t; m.className = 'msg' + (bad ? ' bad' : ''); m.hidden = !t; m.scrollIntoView({ block: 'nearest' }); } }

  /* ---------- sesión ---------- */
  function authView(then, intro) {
    var mode = 'login';
    (function draw() {
      app.innerHTML = '<div class="auth card"><h1>' + (mode === 'login' ? 'Entrar' : 'Crear cuenta') + '</h1><p class="muted">' + esc(intro || 'Con la misma cuenta que usas en la app de ReGroupRide.') + '</p><form class="form" id="f">' +
        (mode === 'signup' ? '<label>Nombre<input id="n" required maxlength="24" autocomplete="name"></label><label>Teléfono<input id="t" type="tel" required minlength="9" maxlength="20" pattern="[0-9+ ]{9,20}" autocomplete="tel"></label>' : '') +
        '<label>Correo<input id="e" type="email" required autocomplete="email"></label><label>Contraseña<input id="p" type="password" required minlength="6" autocomplete="' + (mode === 'login' ? 'current-password' : 'new-password') + '"></label>' +
        '<div id="msg" class="msg" hidden></div><button class="btn pri big" type="submit">' + (mode === 'login' ? 'Entrar' : 'Crear cuenta') + '</button></form>' +
        '<p class="small" style="text-align:center;margin:16px 0 0"><button class="btn txt" id="sw" type="button">' + (mode === 'login' ? 'No tengo cuenta: crear una' : 'Ya tengo cuenta: entrar') + '</button></p></div>';
      $('#sw').onclick = function () { mode = mode === 'login' ? 'signup' : 'login'; draw(); };
      $('#f').onsubmit = function (ev) {
        ev.preventDefault();
        busy($('#f button[type=submit]'), function () {
          var em = $('#e').value.trim(), pw = $('#p').value;
          var q = mode === 'login' ? sb.auth.signInWithPassword({ email: em, password: pw }) : sb.auth.signUp({ email: em, password: pw, options: { data: { name: $('#n').value.trim(), phone: $('#t').value.trim() } } });
          return q.then(function (r) {
            if (r.error) throw r.error;
            if (!r.data.session) { msg('Te hemos enviado un correo para confirmar la cuenta. Ábrelo y vuelve a esta página.'); return; }
            user = r.data.session.user; head(); then();
          });
        });
      };
    })();
  }
  function head() { $('#who').textContent = user ? user.email : ''; $('#out').hidden = !user; }
  $('#out').onclick = function () { sb.auth.signOut().then(function () { user = null; head(); start(); }); };

  /* ---------- página pública de un evento ---------- */
  function eventView(id) {
    sb.rpc('event_public', { p_id: id }).then(function (r) {
      var e = r.data;
      if (r.error || !e) { app.innerHTML = '<div class="auth card"><h1>Evento no encontrado</h1><p class="muted">Puede que el enlace esté mal o que el evento se haya borrado.</p><a class="btn" href="/">Ir al inicio</a></div>'; return; }
      document.title = e.title + ' · ReGroupRide';
      var d = new Date(e.starts_at), past = e.starts_at < Date.now(), cover = safeUrl(e.cover_url), full = e.capacity && e.going >= e.capacity;
      var st = e.mine, reg;
      if (past) reg = '<div class="state"><span class="dot w"></span>Este evento ya ha pasado</div>';
      else if (st === 'going') reg = '<div class="state"><span class="dot"></span>Estás apuntado</div><p class="muted small" style="margin:0">Te lo recordaremos en la app un día y una hora antes.</p><button class="btn" id="leave" type="button">No puedo ir</button>';
      else if (st === 'waiting') reg = '<div class="state"><span class="dot w"></span>Estás en lista de espera</div><p class="muted small" style="margin:0">Si queda una plaza, la app te avisa al momento para que confirmes.</p><button class="btn" id="leave" type="button">Salir de la lista</button>';
      else if (st === 'offered') reg = '<div class="state"><span class="dot"></span>Hay una plaza para ti</div><button class="btn pri big" id="yes" type="button">Sí, voy</button><button class="btn" id="leave" type="button">No puedo, que pase al siguiente</button>';
      else if (!user) reg = '<p style="margin:0">Para apuntarte, entra con tu cuenta de ReGroupRide o crea una.</p><button class="btn pri big" id="login" type="button">' + (full ? 'Apuntarme a la lista de espera' : 'Apuntarme') + '</button>';
      else if (!e.member) reg = '<p style="margin:0">Este evento es de la comunidad <b>' + esc(e.community) + '</b>. Para apuntarte tienes que estar en ella: escribe el código de invitación que te han pasado.</p><form class="form" id="jf"><input id="code" required maxlength="12" placeholder="Código de la comunidad" autocomplete="off" style="text-transform:uppercase"><button class="btn pri big" type="submit">Unirme y apuntarme</button></form>';
      else reg = '<button class="btn pri big" id="go" type="button">' + (full ? 'Apuntarme a la lista de espera' : 'Apuntarme') + '</button>';
      var where = e.meet_name || (e.meet_url ? 'Punto de salida' : '');
      app.innerHTML = '<div class="ev"><div><div class="cover"' + (cover ? ' style="background-image:url(&quot;' + esc(cover) + '&quot;)"' : '') + '>' + (cover ? '' : '<img class="sym" src="/simbolo.svg" alt="">') + '</div>' +
        '<div class="host"><span class="av">' + esc((e.community || '?').charAt(0).toUpperCase()) + '</span><div><span class="muted small">Organiza</span><br><b class="t">' + esc(e.community) + '</b></div></div>' +
        (e.admin ? '<p><a class="btn" href="/?c=' + e.community_id + '&edit=' + e.id + '">Editar evento</a></p>' : '') + '</div>' +
        '<div><h1>' + esc(e.title) + '</h1>' +
        '<div class="row"><div class="tile"><small>' + M[d.getMonth()] + '</small>' + d.getDate() + '</div><div><b>' + DL[d.getDay()] + ', ' + d.getDate() + ' de ' + ML[d.getMonth()] + '</b><span>' + hhmm(d) + ' h</span></div></div>' +
        (where ? '<div class="row"><div class="tile"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.500C5 14.900 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg></div><div><b>' + esc(where) + '</b>' + (safeUrl(e.meet_url) ? '<span><a href="' + esc(e.meet_url) + '" target="_blank" rel="noopener">Cómo llegar</a></span>' : '<span>Punto de salida</span>') + '</div></div>' : '') +
        (e.route_name ? '<div class="row"><div class="tile"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.500"/><circle cx="18" cy="6" r="2.500"/><path d="M8.500 18H14a4 4 0 0 0 0-8h-4a4 4 0 0 1 0-8"/></svg></div><div><b>' + esc(e.route_name) + '</b><span>' + (e.route_km ? String(e.route_km).replace('.', ',') + ' km · ' : '') + 'la ruta se carga en la app</span></div></div>' : '') +
        '<div class="card reg"><div class="hd">Inscripción' + (e.capacity ? ' · ' + e.going + ' de ' + e.capacity + ' plazas' : (e.going ? ' · ' + e.going + (e.going === 1 ? ' persona va' : ' personas van') : '')) + '</div><div class="bd">' + reg + '<div id="msg" class="msg" hidden></div></div></div>' +
        (e.description ? '<h2>Acerca del evento</h2><div class="desc">' + esc(e.description) + '</div>' : '') +
        '<h2>En la app</h2><p class="muted">Con ReGroupRide ves al grupo en el mapa durante la ruta, avisas de una avería o de que necesitas gasolina y te reenganchas si te quedas atrás.</p></div></div>';
      var again = function () { eventView(id); };
      var set = function (status) {
        var q = st ? sb.from('event_attendees').update({ status: status }).eq('event_id', id).eq('user_id', user.id).select('status') : sb.from('event_attendees').insert({ event_id: id, user_id: user.id, status: status }).select('status');
        return q.then(function (r2) { if (r2.error) throw r2.error; ring(e.community_id, { kind: 'att', eid: id }); again(); });
      };
      if ($('#login')) $('#login').onclick = function () { authView(again, 'Para apuntarte a «' + e.title + '».'); };
      if ($('#go')) $('#go').onclick = function () { busy(this, function () { return set('going'); }); };
      if ($('#yes')) $('#yes').onclick = function () { busy(this, function () { return set('going'); }); };
      if ($('#leave')) $('#leave').onclick = function () { busy(this, function () { return set('no'); }); };
      if ($('#jf')) $('#jf').onsubmit = function (ev) { ev.preventDefault(); busy($('#jf button'), function () { return sb.rpc('join_community', { p_code: $('#code').value.trim().toUpperCase() }).then(function (r2) { if (r2.error) throw r2.error; if (r2.data !== e.community_id) throw new Error('Ese código es de otra comunidad.'); return set('going'); }); }); };
    });
  }

  /* ---------- panel: mis comunidades y sus eventos ---------- */
  function loadComs() {
    return sb.from('community_members').select('role,communities(id,name)').eq('user_id', user.id).then(function (r) {
      if (r.error) throw r.error;
      S.coms = (r.data || []).filter(function (x) { return x.communities; }).map(function (x) { return { id: x.communities.id, name: x.communities.name, admin: x.role === 'admin' }; });
      var want = /[?&]c=([0-9a-f-]{36})/i.exec(location.search);
      if (want && S.coms.some(function (c) { return c.id === want[1]; })) S.cid = want[1];
      if (!S.cid || !S.coms.some(function (c) { return c.id === S.cid; })) S.cid = (S.coms.filter(function (c) { return c.admin; })[0] || S.coms[0] || {}).id || null;
    });
  }
  function com() { return S.coms.filter(function (c) { return c.id === S.cid; })[0]; }
  function panel() {
    var c = com();
    if (!c) { app.innerHTML = '<div class="auth card"><h1>Aún no estás en ninguna comunidad</h1><p class="muted">Crea tu comunidad o únete a una desde la app de ReGroupRide (pestaña Comunidad). Después podrás crear sus eventos aquí.</p></div>'; return; }
    app.innerHTML = '<div class="hd1"><h1>Eventos</h1>' + (c.admin ? '<button class="btn pri" id="new" type="button">+ Crear evento</button>' : '') + '</div>' +
      (S.coms.length > 1 ? '<div class="coms">' + S.coms.map(function (x) { return '<button type="button" data-c="' + x.id + '" aria-pressed="' + (x.id === c.id) + '">' + esc(x.name) + '</button>'; }).join('') + '</div>' : '<p class="muted" style="margin-top:-8px">' + esc(c.name) + '</p>') +
      (c.admin ? '' : '<p class="msg">En esta comunidad no eres administrador: puedes ver los eventos y apuntarte, pero no crearlos.</p>') +
      '<div id="msg" class="msg" hidden></div><div class="list" id="list"><p class="muted">Cargando…</p></div>';
    [].forEach.call(document.querySelectorAll('.coms button'), function (b) { b.onclick = function () { S.cid = b.dataset.c; panel(); }; });
    if ($('#new')) $('#new').onclick = function () { editor(null); };
    sb.from('events').select('id,title,starts_at,meet_name,cover_url,capacity,event_attendees(status,companion)').eq('community_id', c.id).order('starts_at', { ascending: false }).limit(60).then(function (r) {
      if (r.error && /cover_url/.test(r.error.message || '')) { $('#list').innerHTML = '<p class="msg bad">Falta ejecutar supabase/11_push_y_web.sql en Supabase para usar esta web.</p>'; return; }
      if (r.error) { $('#list').innerHTML = '<p class="msg bad">' + esc(err(r.error)) + '</p>'; return; }
      var evs = r.data || [], now = Date.now();
      evs.sort(function (a, b) { var A = new Date(a.starts_at).getTime(), B = new Date(b.starts_at).getTime(), fa = A >= now, fb = B >= now; return fa !== fb ? (fa ? -1 : 1) : (fa ? A - B : B - A); });
      $('#list').innerHTML = evs.length ? evs.map(function (e) {
        var d = new Date(e.starts_at), cv = safeUrl(e.cover_url), n = (e.event_attendees || []).filter(function (a) { return a.status === 'going' || a.status === 'offered'; }).reduce(function (s, a) { return s + 1 + (a.companion ? 1 : 0); }, 0), w = (e.event_attendees || []).filter(function (a) { return a.status === 'waiting'; }).length;
        return '<div class="card item" data-id="' + e.id + '"><div class="cover wide"' + (cv ? ' style="background-image:url(&quot;' + esc(cv) + '&quot;)"' : '') + '>' + (cv ? '' : '<img class="sym" src="/simbolo.svg" alt="">') + '</div><div>' +
          '<span class="muted small">' + D[d.getDay()] + ' ' + d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear() + ' · ' + hhmm(d) + (d.getTime() < now ? ' · pasado' : '') + '</span><h3>' + esc(e.title) + '</h3>' +
          '<span class="muted small">' + (e.capacity ? n + ' de ' + e.capacity + ' plazas' : n + (n === 1 ? ' apuntado' : ' apuntados')) + (c.admin && w ? ' · ' + w + ' en espera' : '') + (e.meet_name ? ' · ' + esc(e.meet_name) : '') + '</span>' +
          '<div class="acts"><a class="btn" href="/e/' + e.id + '">Ver página</a><button class="btn" data-a="copy" type="button">Copiar enlace</button>' + (c.admin ? '<button class="btn" data-a="edit" type="button">Editar</button>' : '') + '</div></div></div>';
      }).join('') : '<div class="card"><b class="t">Todavía no hay eventos</b><p class="muted" style="margin:6px 0 0">' + (c.admin ? 'Crea el primero con «Crear evento». Aparecerá también en la app, y a los miembros les llegará el aviso.' : 'Cuando un administrador cree uno, aparecerá aquí y en la app.') + '</p></div>';
      [].forEach.call(document.querySelectorAll('.item'), function (it) {
        var id = it.dataset.id, cp = $('[data-a=copy]', it), ed = $('[data-a=edit]', it);
        cp.onclick = function () { var u = location.origin + '/e/' + id; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { cp.textContent = 'Copiado'; setTimeout(function () { cp.textContent = 'Copiar enlace'; }, 1600); }, function () { window.prompt('Enlace del evento', u); }); };
        if (ed) ed.onclick = function () { editor(id); };
      });
      var we = /[?&]edit=([0-9a-f-]{36})/i.exec(location.search);
      if (we && c.admin) { history.replaceState(null, '', '/'); editor(we[1]); }
    });
  }

  /* ---------- crear o editar un evento ---------- */
  function coverBlob(file) {
    return new Promise(function (ok, no) {
      var im = new Image(), u = URL.createObjectURL(file);
      im.onerror = function () { no(new Error('No se puede leer esa imagen.')); };
      im.onload = function () {
        var W = 1280, H = 720, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
        var k = Math.max(W / im.width, H / im.height), w = im.width * k, h = im.height * k;
        cv.getContext('2d').drawImage(im, (W - w) / 2, (H - h) / 2, w, h); URL.revokeObjectURL(u);
        cv.toBlob(function (b) { b ? ok(b) : no(new Error('No se puede preparar la imagen.')); }, 'image/jpeg', 0.84);
      };
      im.src = u;
    });
  }
  function coords(url) { var m = /@(-?\d+\.\d+),(-?\d+\.\d+)/.exec(url) || /[?&](?:q|query|destination|ll)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/i.exec(url) || /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/.exec(url); return m ? [+m[1], +m[2]] : null; }
  function editor(id) {
    var c = com();
    var draw = function (e) {
      var d = e ? new Date(e.starts_at) : (function () { var x = new Date(Date.now() + 7 * 864e5); x.setHours(10, 0, 0, 0); return x; })(), cv = e && safeUrl(e.cover_url), blob = null;
      app.innerHTML = '<p><button class="btn txt" id="back" type="button">← Eventos de ' + esc(c.name) + '</button></p><form class="edit" id="ef">' +
        '<div><label class="pick"><div class="cover wide" id="cv"' + (cv ? ' style="background-image:url(&quot;' + esc(cv) + '&quot;)"' : '') + '>' + (cv ? '' : '<img class="sym" src="/simbolo.svg" alt="">') + '</div><span>' + (cv ? 'Cambiar portada' : 'Subir portada') + '</span><input id="file" type="file" accept="image/*" hidden></label><p class="muted small">Foto apaisada (16:9). Si no pones ninguna, en la app se ve el mapa del punto de salida.</p></div>' +
        '<div class="form"><input class="title-in" id="title" required maxlength="120" placeholder="Nombre del evento" value="' + esc(e ? e.title : '') + '">' +
        '<div class="two"><label>Empieza<input id="when" type="datetime-local" required value="' + localInput(d) + '"></label><label>Plazas (vacío = sin límite)<input id="cap" type="number" min="1" max="1000" inputmode="numeric" value="' + (e && e.capacity ? e.capacity : '') + '"></label></div>' +
        '<label>Punto de salida<input id="meet" maxlength="120" placeholder="Gasolinera Repsol de Teulada" value="' + esc(e ? e.meet_name : '') + '"></label>' +
        '<label>Enlace de Google Maps del punto de salida (opcional)<input id="murl" inputmode="url" maxlength="600" placeholder="https://maps.app.goo.gl/…" value="' + esc(e && e.meet_url ? e.meet_url : '') + '"></label>' +
        '<label>Descripción<textarea id="desc" maxlength="4000" placeholder="Recorrido, paradas, ritmo, qué hay que llevar…">' + esc(e ? e.description : '') + '</textarea></label>' +
        '<p class="muted small" style="margin:0">La ruta para seguir en el mapa se añade desde la app (editar el evento → «Ruta»).</p>' +
        '<div id="msg" class="msg" hidden></div><button class="btn pri big" type="submit">' + (e ? 'Guardar cambios' : 'Crear evento') + '</button>' +
        (e ? '<button class="btn del" id="del" type="button">Borrar el evento</button>' : '') + '</div></form>';
      $('#back').onclick = panel;
      $('#file').onchange = function () { var f = this.files[0]; if (!f) return; coverBlob(f).then(function (b) { blob = b; var el = $('#cv'); el.style.backgroundImage = 'url("' + URL.createObjectURL(b) + '")'; el.innerHTML = ''; }, function (x) { msg(err(x), true); }); };
      $('#ef').onsubmit = function (ev) {
        ev.preventDefault();
        busy($('#ef button[type=submit]'), function () {
          var t = new Date($('#when').value); if (isNaN(t)) throw new Error('Pon la fecha y la hora.');
          var murl = $('#murl').value.trim(); if (murl && !/^https?:\/\//i.test(murl)) throw new Error('El enlace del punto de salida tiene que empezar por https://');
          var cap = parseInt($('#cap').value, 10), ll = murl ? coords(murl) : null;
          var row = { community_id: c.id, title: $('#title').value.trim(), starts_at: t.toISOString(), meet_name: $('#meet').value.trim(), meet_url: murl || null, description: $('#desc').value.trim(), capacity: cap > 0 ? cap : null };
          if (!e || murl !== (e.meet_url || '')) { row.meet_lat = ll ? ll[0] : null; row.meet_lon = ll ? ll[1] : null; }
          var up = blob ? (function () { var path = user.id + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.jpg'; return sb.storage.from('covers').upload(path, blob, { contentType: 'image/jpeg' }).then(function (r) { if (r.error) throw new Error('No se ha podido subir la portada: ' + err(r.error)); row.cover_url = sb.storage.from('covers').getPublicUrl(path).data.publicUrl; }); })() : Promise.resolve();
          return up.then(function () { return e ? sb.from('events').update(row).eq('id', e.id).select('id') : sb.from('events').insert(row).select('id'); }).then(function (r) {
            if (r.error) throw r.error; if (!r.data || !r.data.length) throw new Error('No se ha guardado: no tienes permiso para editar este evento.');
            ring(c.id, { kind: e ? 'edit' : 'event' }); location.href = '/e/' + r.data[0].id;
          });
        });
      };
      if ($('#del')) $('#del').onclick = function () { var b = this; if (b.dataset.sure) busy(b, function () { return sb.from('events').delete().eq('id', e.id).then(function (r) { if (r.error) throw r.error; ring(c.id, { kind: 'edit' }); panel(); }); }); else { b.dataset.sure = 1; b.textContent = 'Pulsa otra vez para borrarlo (no se puede deshacer)'; } };
    };
    if (!id) { draw(null); return; }
    sb.from('events').select('id,title,description,starts_at,meet_name,meet_url,capacity,cover_url').eq('id', id).maybeSingle().then(function (r) { if (r.error || !r.data) { panel(); return; } draw(r.data); });
  }

  /* ---------- arranque ---------- */
  function start() {
    var id = eventId();
    if (id) { eventView(id); return; }
    if (!user) { authView(start, 'Entra para crear y gestionar los eventos de tu comunidad. Es la misma cuenta de la app.'); return; }
    loadComs().then(panel, function (e) { app.innerHTML = '<p class="msg bad">' + esc(err(e)) + '</p>'; });
  }
  sb.auth.getSession().then(function (r) { user = r.data && r.data.session ? r.data.session.user : null; head(); start(); }, function () { start(); });
})();
</script>
