.top{display:flex;align-items:center;gap:10px}

.pill{font:700 12.5px/1 Manrope,sans-serif;padding:7px 10px;border-radius:999px;background:#E6F6EC;color:#12703A;white-space:nowrap}
.pill.old{background:#FFF1CC;color:#7A5200}.pill.end{background:#ECEAF2;color:#57506A}.pill.alert{background:#C62828;color:#fff}
.row{display:flex;gap:18px;flex-wrap:wrap;color:#57506A;font-size:14.5px}.row b{color:#14101F;font-weight:700}
.alert-box{background:#FDECEC;color:#8E1B1B;border-radius:14px;padding:12px 14px;font-weight:600;display:none}

.btn.sec{background:#E9EDF2;color:#0E141B}
.muted{color:#6E6880;font-size:13px}
.dot{width:22px;height:22px;border-radius:50%;background:#5A2DB0;border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.dot.alert{background:#C62828}
/* estética «Asfalto», la misma que la app */
@font-face{font-family:"Barlow Condensed";src:url(/barlow-condensed-latin-700-normal.woff2) format("woff2");font-weight:700 900;font-display:swap}

body{color:var(--t);background:var(--f)}#map{background:var(--s2)}
.card{background:var(--s);border:1px solid var(--l);border-radius:12px}

.pill{background:var(--s2);color:var(--t)}.pill.old{background:#FFB300;color:#15140F}.pill.end{background:var(--s2);color:var(--t2)}.pill.alert{background:#A31919;color:#fff}

.alert-box{background:#A31919;color:#fff;border-radius:12px}
.btn{font:700 17px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em;min-height:52px;display:flex;align-items:center;justify-content:center;border:var(--fil);color:#15140F}

</div>
