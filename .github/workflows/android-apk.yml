# Compila el APK de pruebas de ReGroupRide en GitHub (no hace falta Android Studio).
# Se ejecuta en cada push a main y también a mano desde Actions → "Android APK" → "Run workflow".
# El APK queda en Releases → "latest" para descargarlo directamente en el móvil.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El runner de GitHub ya trae el SDK de Android (ANDROID_HOME); Gradle descarga lo que falte.

      - name: Dependencias
        run: npm ci

      - name: Tests (inclinación, enlaces de Maps y seguimiento de ruta)
        run: npm test

      - name: Copiar la app a Android
        run: npx cap sync android

      - name: Firma fija de pruebas (para poder actualizar sin desinstalar)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore; else cp android/debug.keystore ~/.android/debug.keystore; fi

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../regroupride.apk

      - uses: actions/upload-artifact@v4
        with:
          name: regroupride-apk
          path: regroupride.apk

      - name: Publicar en la release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ReGroupRide (última compilación)
          body: "APK de pruebas. Para instalar: descárgalo en el móvil, ábrelo y permite instalar desde este origen. Se puede instalar encima de la versión anterior."
          files: regroupride.apk
          prerelease: true
          make_latest: true
